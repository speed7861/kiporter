[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kiporter"
dynamic = ["version"]
description = "Search LCSC, Digi-Key, Mouser, Farnell/Newark, TME and Octopart and import parts into KiCad"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "requests>=2.28",
    "easyeda2kicad==1.0.1",
    "kicad-python>=0.4",
    "charset-normalizer>=3",
    "keyring>=24",
    "Pillow>=10",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/speed7861/kiporter"

[project.gui-scripts]
kiporter = "kiporter.gui:main"

[tool.setuptools]
packages = ["kiporter"]

[tool.setuptools.package-data]
kiporter = ["assets/*"]

[tool.setuptools.dynamic]
version = {attr = "kiporter.__version__"}
